{% extends "base.html" %}

{% block title %}Overview · 国产动画海外舆情看板{% endblock %}

{% block content %}
<h4 class="mb-3">总览 Overview</h4>

<!-- KPI 卡片 -->
<div class="row g-3 mb-4" id="kpi-row"></div>

<!-- 情感概览（platform_balanced 主口径） -->
<div class="row g-3 mb-4">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Series / Film 情感概览（platform_balanced 准入平台等权）</h5>
        <div id="chart-sentiment" style="height: 360px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- 平台样本量 -->
<div class="row g-3">
  <div class="col-12">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">各平台样本量（主样本，排除 other）</h5>
        <div id="chart-platform" style="height: 400px;"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/overview.js') }}"></script>
{% endblock %}
